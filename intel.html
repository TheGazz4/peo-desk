<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEO Engine — Industry Intel</title>
<!--
  INDUSTRY INTEL surface v1.3 (2026-09-23: employees-per-client card restored with calculation + honest ranks; mig 2153). v1.2 (2026-09-23: column-aligned tables, share-price tile, count-coverage note, contradiction guard; mig 2150/2151). v1.1 (2026-09-23: tabs PEO PROFILE | INDUSTRY INTEL; size rank, market share on the 2026 industry count, book coverage, filed-facts-first outlook; mig 2148/2149). v1.0 (Instance B, 2026-09-16). Mounted by the platform shell (index.html) as route #/intel.
  Pick a PEO from the dropdown -> Industry Intel panel (size, market share, size-group yardsticks, model, checks,
  12-month outlook, open flags) + the full PEO profile (template v1).
  Data: dash-ai mode 'sql' (read-only, desk key) calling
    dash_industry_intel_peo_list · industry_intel_for_peo(slug) · industry_intel_profile_chunks(slug)
  Naming law: industry figures are always "Industry verified stats"; models and projections are labelled as such.
  Publish door: desk_assets('intel.html') -> desk_asset_commit('intel.html', ...)
-->
<style>
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19; --page: #0d0d0d; --ink-1: #ffffff; --ink-2: #c3c2b7; --ink-muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-1: #fcfcfb; --page: #f9f9f7; --ink-1: #0b0b0b; --ink-2: #52514e; --ink-muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6; --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--ink-1);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--series-1); }

  header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .06em; white-space: nowrap; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 520px; }
  .picker input[type=search] { flex: 0 1 220px; min-width: 150px; }
  .picker select { flex: 1 1 320px; min-width: 220px; }
  input, select, button { font: inherit; font-size: 13px; color: var(--ink-1); background: var(--surface-1);
    border: 1px solid var(--baseline); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  label.chk { font-size: 12px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  #status { font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
  #status.err { color: var(--critical); }

  main { max-width: 1180px; margin: 0 auto; padding: 16px 20px 40px; }
  .empty { color: var(--ink-muted); padding: 40px 0; text-align: center; }

  .title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 4px 0 12px; }
  .plogo img { display: block; height: 44px; max-width: 200px; object-fit: contain; background: #fff; border: 1px solid var(--line, #d8d4cc); border-radius: 9px; padding: 5px 9px; }
  .plogo .nologo { font-size: 11px; color: var(--ink-muted); border: 1px dashed var(--line, #d8d4cc); border-radius: 9px; padding: 6px 9px; }
  .title h2 { margin: 0; font-size: 22px; }
  .title .meta { color: var(--ink-2); font-size: 13px; }
  .dirlinks { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: -6px 0 12px; font-size: 13px; }
  .dirlinks .maplink { font-weight: 600; }
  .dirlinks .mut { color: var(--ink-muted); font-size: 12px; }
  .dirlinks .also { flex-basis: 100%; color: var(--ink-2); line-height: 1.6; }
  .dirlinks .also.notlisted { border-left: 3px solid var(--warning); padding: 4px 10px; background: color-mix(in srgb, var(--warning) 8%, transparent); border-radius: 0 8px 8px 0; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 0 0 14px; }
  .tabs button { background: none; border: 1px solid transparent; border-bottom: none; border-radius: 8px 8px 0 0;
    color: var(--ink-2); padding: 7px 14px; }
  .tabs button[aria-selected="true"] { color: var(--ink-1); border-color: var(--border); background: var(--surface-1); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .tile .k { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .d { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  section { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; overflow-x: auto; }
  section h3 { font-size: 12px; margin: 0 0 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  .blurb { font-size: 12px; color: var(--ink-2); margin: -2px 0 10px; max-width: 80ch; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--ink-muted); font-weight: 500; font-size: 11px; border-bottom: 1px solid var(--grid); padding: 4px 8px 6px 0; }
  td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--ink-muted); }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 2px 9px;
    border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
  .chip.strong { border-color: color-mix(in srgb, var(--good) 55%, transparent); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .chip.strong::before { background: var(--good); }
  .chip.good { border-color: color-mix(in srgb, var(--series-1) 55%, transparent); background: color-mix(in srgb, var(--series-1) 14%, transparent); }
  .chip.good::before { background: var(--series-1); }
  .chip.fair { border-color: color-mix(in srgb, var(--warning) 55%, transparent); background: color-mix(in srgb, var(--warning) 14%, transparent); }
  .chip.fair::before { background: var(--warning); }
  .chip.weak { border-color: color-mix(in srgb, var(--serious) 60%, transparent); background: color-mix(in srgb, var(--serious) 16%, transparent); }
  .chip.weak::before { background: var(--serious); }

  .band { position: relative; height: 10px; background: var(--grid); border-radius: 5px; min-width: 140px; margin-top: 6px; }
  .band .iqr { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--series-1) 35%, transparent); border-radius: 5px; }
  .band .med { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink-2); }
  .band .you { position: absolute; top: -4px; width: 10px; height: 18px; margin-left: -5px; border-radius: 3px; background: var(--series-1); border: 2px solid var(--page); }

  .flag { border-left: 3px solid var(--warning); padding: 6px 10px; margin: 6px 0; background: color-mix(in srgb, var(--warning) 8%, transparent); border-radius: 0 8px 8px 0; font-size: 13px; }
  .note { font-size: 12px; color: var(--ink-muted); margin-top: 8px; }
  .source { font-size: 12px; color: var(--ink-muted); margin: 6px 0 0; }

  /* rendered profile */
  .md { max-width: 980px; }
  .md h1 { font-size: 22px; margin: 4px 0 2px; }
  .md h2 { font-size: 16px; margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .md h3 { font-size: 14px; margin: 16px 0 6px; color: var(--ink-2); }
  .md p { margin: 6px 0; max-width: 90ch; }
  .md ul { margin: 6px 0; padding-left: 20px; }
  .md table { margin: 8px 0 12px; }
  .md .tw { overflow-x: auto; }
  .md td, .md th { white-space: normal; }
  table.aligned th, table.aligned td { text-align: left; padding: 7px 14px 7px 0; }
  table.aligned th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-muted); font-weight: 600; border-bottom: 1px solid var(--baseline); vertical-align: bottom; }
  table.aligned th.num, table.aligned td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 14px; }
  table.aligned th:last-child, table.aligned td:last-child { padding-right: 0; }
  table.aligned tbody tr:hover td { background: color-mix(in srgb, var(--ink-1) 3%, transparent); }
  section table th { text-align: left; }
  .big { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .big .unit { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 6px; }
  .rank { font-size: 13px; font-weight: 600; margin: 6px 0 10px; }
  table.calc td { font-size: 12.5px; padding: 6px 12px 6px 0; vertical-align: top; }
  table.calc td:first-child { color: var(--ink-muted); white-space: nowrap; width: 1%; }
  section table th.num { text-align: right; }

  #overlay { position: fixed; inset: 0; background: var(--page); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #overlay .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 24px 28px; width: 360px; }
  #overlay h2 { margin: 0 0 6px; font-size: 15px; }
  #overlay p { color: var(--ink-2); font-size: 13px; }
  #overlay input { width: 100%; }
  #overlay button { margin-top: 12px; width: 100%; background: var(--series-1); color: #fff; border: none; font-weight: 600; }
  #overlay .err { color: var(--critical); font-size: 12px; min-height: 16px; margin-top: 8px; }
  .hidden { display: none !important; }

  @media (max-width: 720px) {
    header { padding: 10px 12px; }
    main { padding: 12px; }
    .grid2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="overlay" class="hidden">
  <div class="card">
    <h2>Industry Intel</h2>
    <p>Enter your desk access key. It is stored only in this browser and unlocks every desk surface.</p>
    <input id="keyInput" type="password" placeholder="desk key" autocomplete="off">
    <div class="err" id="keyErr"></div>
    <button id="keyGo" type="button">Open</button>
  </div>
</div>

<header>
  <h1>INDUSTRY INTEL</h1>
  <div class="picker">
    <input id="q" type="search" placeholder="Type to filter PEOs…" autocomplete="off">
    <select id="peo" aria-label="Choose a PEO"><option value="">Loading PEOs…</option></select>
    <label class="chk"><input id="onlyEst" type="checkbox"> only PEOs with a size estimate</label>
  </div>
  <span id="status"></span>
</header>

<main id="main">
  <div class="empty">Choose a PEO from the dropdown to see its Industry Intel and full profile.</div>
</main>

<script>
(function () {
  "use strict";

  var SB = "https://lzasgflrxxrssjntrfmt.supabase.co";
  var FN = SB + "/functions/v1/dash-ai";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6YXNnZmxyeHhyc3NqbnRyZm10Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwMjY3MTMsImV4cCI6MjA3OTYwMjcxM30.TwkqPgQ8C9q4_S4C9Xu3-WEyIdoMUHdbRWcUHBOy2c8";

  var mem = {};
  function sget(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }

  var saved = sget("desk_theme");
  if (saved) document.documentElement.dataset.theme = saved;
  window.addEventListener("storage", function (e) { if (e.key === "desk_theme" && e.newValue) document.documentElement.dataset.theme = e.newValue; });

  var KEY = sget("desk_key") || sget("peo_dash_key") || "";
  var ALL = [];
  var current = null;
  var loadToken = 0;

  /* ---------- PEO logos (owner 2026-09-24: see each PEO's logo on its profile) ----------
     Same source as the Coverage Map chips: map-data mode=logos_all = every saved logo (pub.map_logos <- peo_logo_registry,
     published the moment a logo is harvested, migration 1274). One request per page load. */
  var LOGOS_P = null;
  function logos() {
    if (LOGOS_P) return LOGOS_P;
    var h = { "apikey": ANON, "Authorization": "Bearer " + ANON };
    if (KEY) h["x-desk-key"] = KEY;
    LOGOS_P = fetch(SB + "/functions/v1/map-data?mode=logos_all&d=intel-" + new Date().toISOString().slice(0, 13), { headers: h })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (j) { return (j && j.logos) || {}; })
      .catch(function () { LOGOS_P = null; return {}; });
    return LOGOS_P;
  }
  function drawLogo(slug, name, tok) {
    logos().then(function (L) {
      if (tok !== loadToken) return;
      var box = $("pLogo"); if (!box) return;
      var d = L[slug];
      box.innerHTML = d ? '<img alt="' + esc(name) + ' logo" src="' + esc(d) + '">' : '<span class="nologo" title="No logo saved for this PEO yet">no logo on file</span>';
    });
  }

  function setStatus(msg, err) { var s = $("status"); s.textContent = msg || ""; s.className = err ? "err" : ""; }

  /* ---------- data: dash-ai read-only SQL ---------- */
  function sql(q, label, ms) {
    var h = { "Content-Type": "application/json", "apikey": ANON, "Authorization": "Bearer " + ANON };
    if (KEY) h["x-desk-key"] = KEY;
    var opts = { method: "POST", headers: h, body: JSON.stringify({ mode: "sql", sql: q, label: label, quiet: true }) };
    if (window.AbortSignal && AbortSignal.timeout) opts.signal = AbortSignal.timeout(ms || 45000);
    return fetch(FN, opts).then(function (r) {
      return r.json().then(function (j) {
        if (r.status === 401 || r.status === 403) { askKey("That key was not accepted."); throw new Error("unauthorized"); }
        if (!r.ok || j.error) throw new Error((j && (j.detail || j.error)) || ("HTTP " + r.status));
        return j;
      });
    });
  }

  function askKey(msg) {
    $("overlay").classList.remove("hidden");
    $("keyErr").textContent = msg || "";
    $("keyInput").focus();
  }
  $("keyGo").onclick = function () {
    var k = $("keyInput").value.trim();
    if (!k) { $("keyErr").textContent = "Enter the key."; return; }
    KEY = k; sset("desk_key", k); sset("peo_dash_key", k);
    $("overlay").classList.add("hidden");
    loadList();
  };
  $("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("keyGo").click(); });

  /* ---------- formatting ---------- */
  function n0(v) { return v == null || v === "" || isNaN(v) ? "—" : Math.round(Number(v)).toLocaleString(); }
  function n1(v) { return v == null || v === "" || isNaN(v) ? "—" : Number(v).toLocaleString(undefined, { maximumFractionDigits: 1 }); }
  function usd(v) {
    if (v == null || isNaN(v)) return "—";
    var x = Number(v), a = Math.abs(x);
    if (a >= 1e9) return "$" + (x / 1e9).toFixed(1) + "B";
    if (a >= 1e6) return "$" + (x / 1e6).toFixed(1) + "M";
    if (a >= 1e4) return "$" + Math.round(x / 1e3).toLocaleString() + "K";
    return "$" + Math.round(x).toLocaleString();
  }
  function unitFmt(v, unit) {
    if (v == null || isNaN(v)) return "—";
    if (unit === "usd") return "$" + Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
    if (unit === "pct") return n1(v) + "%";
    return n1(v);
  }
  function range(lo, hi) { if (lo == null && hi == null) return "—"; if (Number(lo) === Number(hi)) return n0(lo); return n0(lo) + "–" + n0(hi); }
  function dateFmt(d) { if (!d) return "—"; var t = new Date(String(d).slice(0, 10) + "T00:00:00"); return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); }
  var GROUP = { smallest_lt2500: "Under 2,500", medium_2500_10000: "2,500–10,000", largest_gt10000: "Over 10,000" };
  var GRADE_WORD = { strong: "strong", good: "good", fair: "fair", weak: "weak", above_median: "above middle", below_median: "below middle" };

  /* ---------- dropdown ---------- */
  function loadList() {
    setStatus("loading PEOs…");
    // 1283 (owner 2026-09-24): this list IS the map's left-hand PEO filter - same entries, same names, same count.
    // dash_peo_directory reads pub.map_filter_catalog (brand grain); older entities and acquired brands ride inside
    // their parent as "Also filed as". Parity guard: v_peo_directory_parity must stay empty.
    var base = "select family_slug, peo_name, legal_name, entity_class, n_clients, n_placed, wse_low, wse_high, wse_status, size_group, also_filed_as, members from dash_peo_directory order by lower(peo_name), family_slug";
    var pages = [0, 450];
    Promise.all(pages.map(function (off) { return sql(base + " limit 450 offset " + off, "industry intel list", 30000); }))
      .then(function (res) {
        ALL = [];
        res.forEach(function (j) { ALL = ALL.concat(j.rows || []); });
        var seen = {};
        ALL = ALL.filter(function (r) { if (seen[r.family_slug]) return false; seen[r.family_slug] = 1; return true; });
        ALL.sort(function (a, b) { return String(a.peo_name).toLowerCase().localeCompare(String(b.peo_name).toLowerCase()) || String(a.family_slug).localeCompare(String(b.family_slug)); });
        drawOptions();
        setStatus(ALL.length.toLocaleString() + " PEOs · same list as the map filter");
        var want = (location.hash.match(/peo=([a-z0-9_]+)/) || [])[1] || sget("intel_last_peo");
        if (want) { if (ALL.some(function (r) { return r.family_slug === want; })) $("peo").value = want; open(want); }
      })
      .catch(function (e) { if (String(e.message) !== "unauthorized") setStatus("could not load PEOs: " + e.message, true); });
  }

  function drawOptions() {
    var q = $("q").value.trim().toLowerCase();
    var only = $("onlyEst").checked;
    var sel = $("peo"), keep = sel.value;
    var rows = ALL.filter(function (r) {
      if (only && r.wse_high == null) return false;
      if (!q) return true;
      return (String(r.peo_name) + " " + (r.legal_name || "") + " " + (r.also_filed_as || "") + " " + r.family_slug).toLowerCase().indexOf(q) >= 0;
    });
    var html = '<option value="">' + (rows.length ? "Choose a PEO (" + rows.length.toLocaleString() + ")" : "No PEOs match") + "</option>";
    html += rows.map(function (r) {
      var size = r.wse_high != null ? " — " + range(r.wse_low, r.wse_high) + " WSEs" : "";
      return '<option value="' + esc(r.family_slug) + '">' + esc(r.peo_name + size) + "</option>";
    }).join("");
    sel.innerHTML = html;
    if (keep && rows.some(function (r) { return r.family_slug === keep; })) sel.value = keep;
  }
  $("q").addEventListener("input", drawOptions);
  $("onlyEst").addEventListener("change", drawOptions);
  $("peo").addEventListener("change", function () { if (this.value) open(this.value); });
  // 1283: in-page links (#peo=slug) - "Also filed as" members and "shown on the map as" parents
  window.addEventListener("hashchange", function () {
    var s = (location.hash.match(/peo=([a-z0-9_]+)/) || [])[1];
    if (s && s !== current) { if (ALL.some(function (r) { return r.family_slug === s; })) $("peo").value = s; open(s); }
  });

  /* ---------- open one PEO ---------- */
  function open(slug) {
    if (!/^[a-z0-9_]+$/.test(slug)) return;
    current = slug;
    sset("intel_last_peo", slug);
    try { history.replaceState(null, "", "#peo=" + slug); } catch (e) { /* ignore */ }
    var tok = ++loadToken;
    var row = ALL.filter(function (r) { return r.family_slug === slug; })[0] || { peo_name: slug };
    $("main").innerHTML =
      '<div class="title"><span class="plogo" id="pLogo"></span><h2>' + esc(row.peo_name) + '</h2><span class="meta" id="titleMeta"></span></div>' +
      '<div class="dirlinks" id="dirLinks"></div>' +
      '<div class="tabs" role="tablist">' +
        '<button type="button" role="tab" data-tab="profile" aria-selected="true">PEO PROFILE</button>' +
        '<button type="button" role="tab" data-tab="intel" aria-selected="false">INDUSTRY INTEL</button>' +
      "</div>" +
      '<div id="tab-profile"><div id="profFacts"><div class="empty">Loading…</div></div>' +
        '<div id="profText"><div class="empty">Loading the full profile… (large PEOs take up to 15 seconds)</div></div></div>' +
      '<div id="tab-intel" class="hidden"><div class="empty">Loading Industry Intel…</div></div>';
    Array.prototype.forEach.call(document.querySelectorAll(".tabs button"), function (b) {
      b.onclick = function () { showTab(b.dataset.tab); };
    });
    setStatus("loading " + row.peo_name + "…");
    drawLogo(slug, row.peo_name, tok);
    drawDirLinks(slug, row, tok);

    sql("select industry_intel_for_peo('" + slug + "') as j", "industry intel panel", 45000)
      .then(function (res) { if (tok !== loadToken) return; renderIntel((res.rows && res.rows[0] && res.rows[0].j) || {}); setStatus(""); })

        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var cells = function (r) { return r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); }); };
        var t = '<div class="tw"><table class="aligned">', start = 0, head = null, aligns = [];
        if (rows.length > 1 && /^\s*\|?\s*:?-{2,}/.test(rows[1])) {
          head = cells(rows[0]);
          aligns = cells(rows[1]).map(function (c) { return /-:\s*$/.test(c) ? "num" : ""; });
          start = 2;
        }
        var body = rows.slice(start).map(cells), ncol = Math.max.apply(null, body.map(function (b) { return b.length; }).concat([head ? head.length : 0]));
        for (var ci = 1; ci < ncol; ci++) {           /* first column is always the label column */
          if (aligns[ci]) continue;
          var yes = 0, no = 0;
          body.forEach(function (b) { var v = numLike(b[ci]); if (v === true) yes++; else if (v === false) no++; });
          if (yes > 0 && yes / (yes + no) >= 0.6) aligns[ci] = "num";
        }
        if (head && head.some(function (x) { return x; })) t += "<thead><tr>" + head.map(function (x, k) { return "<th" + (aligns[k] ? ' class="num"' : "") + ">" + inline(x) + "</th>"; }).join("") + "</tr></thead>";
        t += "<tbody>";
        body.forEach(function (b) {
          var tr = "";
          for (var k = 0; k < ncol; k++) { var x = b[k] == null ? "" : b[k]; tr += "<td" + (aligns[k] ? ' class="num"' : "") + ">" + inline(x) + "</td>"; }
          t += "<tr>" + tr + "</tr>";
        });
        t += "</tbody>";
        out.push(t + "</table></div>");
        continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push("<li>" + inline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>"); i++; }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }
      var para = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !/^\s*\|/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* ---------- start ---------- */
  if (!KEY) askKey(); else loadList();
})();
</script>
