<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEO Engine — Platform Desk</title>
<!--
  ============================================================================
  PEO ENGINE PLATFORM SHELL  (desk_shell_law, 2026-09-14)
  This file is the SHELL ONLY. It contains no panels and no data calls.
  The Command Desk panels that used to live at index.html now live in desk.html
  and are UNCHANGED (byte-identical move). Edit panels there, not here.
  Surfaces are mounted in same-origin iframes so each page keeps its own
  version, its own publish path, and the shared localStorage desk_key.
  Publish door: RE-SYNC -> desk_assets -> desk_asset_commit('index.html', ...)
  ============================================================================
-->
<style>
  :root {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-muted: #898781;
    --grid: #2c2c2a;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --ink-1: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--page); color:var(--ink-1);
    font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    padding:8px 16px; border-bottom:1px solid var(--border); background:var(--surface-1); flex:none; }
  .brand { font-size:13px; font-weight:650; letter-spacing:.10em; white-space:nowrap; }
  .brand span { color:var(--ink-muted); font-weight:400; letter-spacing:.04em; }

  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { background:none; border:1px solid transparent; color:var(--ink-2);
    border-radius:8px; padding:5px 12px; cursor:pointer; font-size:13px; font-family:inherit;
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  nav button:hover { color:var(--ink-1); background:rgba(127,127,127,.12); }
  nav button[aria-current="page"] { color:var(--ink-1); background:rgba(57,135,229,.16);
    border-color:var(--series-1); font-weight:600; }
  nav button .n { font-size:10px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }

  .spacer { margin-left:auto; }
  .ctl { background:none; border:1px solid var(--border); color:var(--ink-2);
    border-radius:6px; padding:3px 10px; cursor:pointer; font-size:12px; font-family:inherit; }
  .ctl:hover { color:var(--ink-1); }
  #keychip { font-size:11px; padding:2px 10px; border-radius:999px; border:1px solid var(--border);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  #keychip::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--ink-muted); flex:none; }
  #keychip.ok::before { background:var(--good); }
  #keychip.no::before { background:var(--warning); }
  #keychip.ok { color:var(--ink-2); }
  #keychip.no { color:var(--warning); }

  #banner { display:none; font-size:12px; color:var(--ink-1); background:rgba(250,178,25,.14);
    border-bottom:1px solid var(--border); padding:7px 16px; flex:none; }
  #banner.show { display:block; }

  #stage { position:relative; flex:1 1 auto; min-height:0; background:var(--page); }
  #stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--page); }
  #stage iframe.live { display:block; }
  #loading { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    color:var(--ink-muted); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  #loading.show { display:flex; }

  @media (max-width: 720px) {
    header { padding:8px 10px; gap:8px; }
    .brand { width:100%; }
    nav button { padding:5px 9px; font-size:12px; }
    nav button .n { display:none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">PEO ENGINE <span>· platform desk</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <span id="keychip" class="no">key</span>
  <button class="ctl" id="reloadBtn" title="Reload the surface you are on">reload</button>
  <button class="ctl" id="popBtn" title="Open this surface in its own tab">open ↗</button>
  <button class="ctl" id="themeBtn">theme</button>
</header>

<div id="banner"></div>

<div id="stage">
  <div id="loading">loading…</div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- route table: the whole platform, one place ---------- */
  var ROUTES = [
    { id:"desk",   file:"desk.html",   label:"Command Desk", hint:"ops, mesh scorecard, health", refresh:true  },
    { id:"map",    file:"map.html",    label:"Coverage Map",  hint:"companies, pins, book",       refresh:true  },
    { id:"ask",    file:"ask.html",    label:"AI Data Desk",  hint:"pulls, PEOs, renewal intel",  refresh:false },
    { id:"send",   file:"send.html",   label:"Send Desk",     hint:"outbound gate + lanes",       refresh:true  },
    { id:"review", file:"review.html", label:"Review",        hint:"adjudication queue",          refresh:false }
  ];
  var STALE_MS = 5 * 60 * 1000;   /* a refreshable surface hidden this long reloads on return */

  var stage   = document.getElementById("stage");
  var nav     = document.getElementById("nav");
  var loading = document.getElementById("loading");
  var banner  = document.getElementById("banner");
  var frames  = {};      /* id -> iframe */
  var hiddenAt= {};      /* id -> epoch ms when it was last hidden */
  var current = null;

  function ls(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lset(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

  /* ---------- theme (shared with every surface via desk_theme) ---------- */
  var saved = ls("desk_theme");
  if (saved) document.documentElement.dataset.theme = saved;
  document.getElementById("themeBtn").onclick = function () {
    var next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    lset("desk_theme", next);
  };

  /* ---------- desk key status (same origin => one key for all surfaces) ---------- */
  function keyStatus() {
    var k = ls("desk_key") || ls("peo_dash_key");
    var chip = document.getElementById("keychip");
    if (k) { chip.className = "ok"; chip.textContent = "desk key set"; banner.className = ""; }
    else {
      chip.className = "no"; chip.textContent = "no desk key";
      banner.textContent = "No desk key in this browser. Sign in on any surface below (Vault: desk_access_key) — it unlocks all of them.";
      banner.className = "show";
    }
  }
  setInterval(keyStatus, 3000);

  /* ---------- nav ---------- */
  ROUTES.forEach(function (r, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.title = r.hint;
    b.innerHTML = '<span class="n">' + (i + 1) + '</span>' + r.label;
    b.onclick = function () { location.hash = "#/" + r.id; };
    b.dataset.route = r.id;
    nav.appendChild(b);
  });

  function route(id) {
    var r = null, i;
    for (i = 0; i < ROUTES.length; i++) if (ROUTES[i].id === id) r = ROUTES[i];
    return r;
  }

  function show(id) {
    var r = route(id);
    if (!r) { location.hash = "#/" + ROUTES[0].id; return; }
    if (current === id) return;

    if (current && frames[current]) {
      frames[current].classList.remove("live");
      hiddenAt[current] = Date.now();
    }
    current = id;

    var f = frames[id];
    if (!f) {
      f = document.createElement("iframe");
      f.src = r.file;
      f.title = r.label;
      f.setAttribute("allow", "clipboard-write");
      loading.classList.add("show");
      f.addEventListener("load", function () { loading.classList.remove("show"); });
      frames[id] = f;
      stage.appendChild(f);
    } else if (r.refresh && hiddenAt[id] && (Date.now() - hiddenAt[id]) > STALE_MS) {
      loading.classList.add("show");
      f.contentWindow.location.reload();
    }
    f.classList.add("live");

    var btns = nav.querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].dataset.route === id) btns[i].setAttribute("aria-current", "page");
      else btns[i].removeAttribute("aria-current");
    }
    document.title = "PEO Engine — " + r.label;
  }

  document.getElementById("reloadBtn").onclick = function () {
    if (frames[current]) { loading.classList.add("show"); frames[current].contentWindow.location.reload(); }
  };
  document.getElementById("popBtn").onclick = function () {
    var r = route(current); if (r) window.open(r.file, "_blank", "noopener");
  };

  /* ---------- keyboard 1..5 ---------- */
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target || {};
    if (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable) return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= ROUTES.length) location.hash = "#/" + ROUTES[n - 1].id;
  });

  function fromHash() {
    var h = (location.hash || "").replace(/^#\/?/, "").split("?")[0];
    show(h || ROUTES[0].id);
  }
  window.addEventListener("hashchange", fromHash);

  keyStatus();
  if (!location.hash) location.replace("#/" + ROUTES[0].id);
  fromHash();
})();
</script>
</body>
</html>
